<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jonny Livestock | Quality Sheep, Goats & Cows</title>
  <meta name="description"
    content="Browse quality sheep, goats, and cows directly from Jonny Livestock. Transparent pricing, exact weights, and direct delivery and preparation services." />

  <!-- Preload LCP Candidate for Home page (Responsive AVIF: mobile 53KB, desktop 64KB) -->
  <link rel="preload" as="image" href="/hero-livestock-sm.avif" type="image/avif" media="(max-width: 640px)" fetchpriority="high" />
  <link rel="preload" as="image" href="/hero-livestock.avif" type="image/avif" media="(min-width: 641px)" fetchpriority="high" />

  <!-- Preload Critical Variable Font -->
  <link rel="preload" as="font" type="font/woff2" href="/assets/plus-jakarta-sans-latin-wght-normal-eXO_dkmS.woff2" crossorigin />

  <!-- Route-aware LCP Preload Hint for inner routes -->
  <script>
    (function () {
      try {
        var p = window.location.pathname || '';
        if (p === '/' || p === '') return; // handled by responsive static link above

        var link = document.createElement('link');
        link.rel = 'preload';
        link.as = 'image';
        link.fetchPriority = 'high';

        if (p.startsWith('/packages')) {
          link.href = 'https://images.unsplash.com/photo-1484557052118-f32bd25b45b5?auto=format&fit=crop&fm=webp&q=65&w=480&h=208';
          document.head.appendChild(link);
        } else if (p.startsWith('/cows')) {
          link.href = 'https://images.unsplash.com/photo-1546445317-29f4545e9d53?auto=format&fit=crop&fm=webp&q=75&w=380';
          document.head.appendChild(link);
        } else if (p.startsWith('/sheep')) {
          link.href = 'https://images.unsplash.com/photo-1484557052118-f32bd25b45b5?auto=format&fit=crop&fm=webp&q=75&w=380';
          document.head.appendChild(link);
        } else if (p.startsWith('/goats')) {
          link.href = 'https://images.unsplash.com/photo-1524024973431-2ad916746881?auto=format&fit=crop&fm=webp&q=75&w=380';
          document.head.appendChild(link);
        } else if (p.startsWith('/about')) {
          link.href = 'https://images.unsplash.com/photo-1546445317-29f4545e9d53?auto=format&fit=crop&fm=webp&q=60&w=440&h=330';
          document.head.appendChild(link);
        }
      } catch (e) {}
    })();
  </script>

  <!-- Preconnect to image CDN -->
  <link rel="preconnect" href="https://images.unsplash.com" crossorigin />
  <link rel="dns-prefetch" href="https://images.unsplash.com" />
</head>

<body class="min-h-screen transition-colors duration-300">
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
