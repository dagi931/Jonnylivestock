  <!-- Route-aware LCP Preload Hint for All Pages -->
  <script>
    (function () {
      try {
        var p = window.location.pathname || '';
        var isMobile = (window.innerWidth <= 640);
        var href = null;

        if (p === '/' || p === '') {
          href = isMobile ? '/hero-livestock-sm.webp' : '/hero-livestock.webp';
        } else if (p.startsWith('/packages')) {
          href = isMobile
            ? 'https://images.unsplash.com/photo-1484557052118-f32bd25b45b5?auto=format&fit=crop&fm=webp&q=50&w=360&h=156'
            : 'https://images.unsplash.com/photo-1484557052118-f32bd25b45b5?auto=format&fit=crop&fm=webp&q=50&w=480&h=208';
        } else if (p.startsWith('/about')) {
          href = isMobile ? '/about-farm-sm.webp' : '/about-farm-md.webp';
        }

        if (href) {
          var link = document.createElement('link');
          link.rel = 'preload';
          link.as = 'image';
          link.type = 'image/webp';
          link.fetchPriority = 'high';
          link.href = href;
          document.head.appendChild(link);
        }
      } catch (e) {}
    })();
  </script>
