<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jonny Livestock | Quality Sheep, Goats & Cows</title>
  <meta name="description"
    content="Browse quality sheep, goats, and cows directly from Jonny Livestock. Transparent pricing, exact weights, and direct delivery and preparation services." />

  <!-- Preload Critical Variable Font & Brand Logo -->
  <link rel="preload" as="font" type="font/woff2" href="/assets/plus-jakarta-sans-latin-wght-normal-eXO_dkmS.woff2" crossorigin />
  <link rel="preload" as="image" type="image/webp" href="/logo-sm.webp" fetchpriority="high" />

  <!-- Route-aware LCP Preload Hint for All Pages -->
  <script>
    (function () {
      try {
        var p = window.location.pathname || '';
        var isMobile = (window.innerWidth <= 640);
        var href = null;

        if (p === '/' || p === '') {
          href = isMobile ? '/hero-livestock-sm.webp' : '/hero-livestock.webp';
        } else if (p.startsWith('/sheep')) {
          href = isMobile ? '/uploads/animal-1788968486752-389037093-sm.webp' : '/uploads/animal-1788968486752-389037093-md.webp';
        } else if (p.startsWith('/goats')) {
          href = isMobile ? '/uploads/animal-1788967818897-191211413-sm.webp' : '/uploads/animal-1788967818897-191211413-md.webp';
        } else if (p.startsWith('/cows')) {
          href = isMobile ? '/uploads/animal-1788968827368-960236987-sm.webp' : '/uploads/animal-1788968827368-960236987-md.webp';
        } else if (p.startsWith('/packages')) {
          href = isMobile
            ? 'https://images.unsplash.com/photo-1484557052118-f32bd25b45b5?auto=format&fit=crop&fm=webp&q=50&w=360&h=156'
            : 'https://images.unsplash.com/photo-1484557052118-f32bd25b45b5?auto=format&fit=crop&fm=webp&q=50&w=480&h=208';
        } else if (p.startsWith('/about')) {
          href = isMobile ? '/about-farm-sm.webp' : '/about-farm-md.webp';
        }

        if (href) {
          var link = document.createElement('link');
          link.rel = 'preload';
          link.as = 'image';
          link.type = 'image/webp';
          link.fetchPriority = 'high';
          link.href = href;
          document.head.appendChild(link);
        }
      } catch (e) {}
    })();
  </script>
</head>

<body class="min-h-screen">
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
